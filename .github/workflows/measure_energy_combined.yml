name: TheLounge Energy Profiling (Combined Windows & Mac)

on:
  workflow_dispatch:

jobs:
  profile-windows:
    name: Profile AMD Windows
    runs-on: [self-hosted, Windows]
    permissions:
      contents: write

    env:
      PROJECT_NAME: "thelounge"
      RUN_ID: "win_${{ github.run_id }}"
      DATA_DIR: "D:\\myPortfolioProject\\thelounge-energy-profiling\\ResearchData\\cpudata\\win_${{ github.run_id }}"
      UPROF_PATH: "C:\\Program Files\\AMD\\AMDuProf\\bin\\AMDuProfCLI.exe"
      NODE_IMAGE: "node:22"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Directory Structure
        run: |
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Idle"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Yarn_Install"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Build"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Test"
          New-Item -ItemType Directory -Force -Path "$env:DATA_DIR\Vitest_Directory_Spans"
        shell: powershell

      - name: Capture Hardware Metadata
        run: |
          $meta = @{
            platform     = "amd_windows"
            captured_at  = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
            cpu_model    = (Get-CimInstance Win32_Processor).Name
            cpu_cores    = (Get-CimInstance Win32_Processor).NumberOfCores
            cpu_threads  = (Get-CimInstance Win32_Processor).NumberOfLogicalProcessors
            cpu_max_mhz  = (Get-CimInstance Win32_Processor).MaxClockSpeed
            ram_gb       = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
            os_version   = (Get-CimInstance Win32_OperatingSystem).Caption
            docker_ver   = (docker --version)
          }
          $meta | ConvertTo-Json | Out-File -FilePath "$env:DATA_DIR\hardware_metadata.json" -Encoding utf8
          Write-Host "Hardware metadata captured:"
          $meta | ConvertTo-Json
        shell: powershell

      - name: Define Windows UTF-8 JSON Writer
        run: |
          @'
          function Write-Utf8JsonNoBom($Path, $Value) {
            $json = $Value | ConvertTo-Json -Compress
            $encoding = New-Object System.Text.UTF8Encoding($false)
            [System.IO.File]::WriteAllText($Path, $json, $encoding)
          }
          '@ | Out-File -FilePath "$env:DATA_DIR\write-json.ps1" -Encoding ascii
        shell: powershell

      # --- INFRASTRUCTURE: pre-pull Node image (NOT profiled) ---
      # The image download must NOT happen inside a measured scenario, or its
      # network/disk cost would pollute the Yarn_Install energy reading.
      - name: Pre-pull Node Image
        run: |
          Write-Host "Pre-pulling $env:NODE_IMAGE (excluded from all measurements)..."
          docker pull --platform linux/amd64 $env:NODE_IMAGE
        shell: powershell

      # --- SCENARIO 1: IDLE (BASELINE) ---
      - name: Profile Idle Scenario
        run: |
          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          echo "Generated Trace-ID: $w3cTraceparent"
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d 60 -o `"$env:DATA_DIR\Idle\power_data.csv`"" -PassThru -WindowStyle Hidden

          echo "Capturing 10-second pre-execution baseline..."
          Start-Sleep -Seconds 10

          echo "Idle baseline measurement..."
          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          Start-Sleep -Seconds 30
          $endTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"

          echo "Capturing 10-second post-execution cooldown..."
          Start-Sleep -Seconds 10

          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue

          echo "Idle_Start,$startTime,$w3cTraceparent" > "$env:DATA_DIR\Idle\timestamps.csv"
          echo "Idle_End,$endTime,$w3cTraceparent" >> "$env:DATA_DIR\Idle\timestamps.csv"
        shell: powershell

      # --- SCENARIO 2: YARN INSTALL ---
      - name: Profile Yarn Install
        run: |
          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $profilerCap = 900
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$env:DATA_DIR\Yarn_Install\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10

          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/amd64 $env:NODE_IMAGE yarn install --frozen-lockfile ; $global:LASTEXITCODE = 0
          $endTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"

          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue

          echo "Yarn_Install_Start,$startTime,$w3cTraceparent" > "$env:DATA_DIR\Yarn_Install\timestamps.csv"
          echo "Yarn_Install_End,$endTime,$w3cTraceparent" >> "$env:DATA_DIR\Yarn_Install\timestamps.csv"

          $actualSec = ((Get-Date $endTime) - (Get-Date $startTime)).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$env:DATA_DIR\Yarn_Install\duration_check.json" @{ task_seconds = [math]::Round($actualSec,2); profiler_cap_seconds = $profilerCap; usable_cap_seconds = $usableCap; truncated = $truncated }
          if ($truncated) {
            Write-Error "TRUNCATED DATA: Yarn install ran ${actualSec}s but profiler usable window was ${usableCap}s"
            exit 1
          }
        shell: powershell

      # --- SCENARIO 3: BUILD ---
      - name: Profile Build
        run: |
          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $profilerCap = 600
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$env:DATA_DIR\Build\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10

          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/amd64 $env:NODE_IMAGE yarn build ; $global:LASTEXITCODE = 0
          $endTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"

          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue

          echo "Build_Start,$startTime,$w3cTraceparent" > "$env:DATA_DIR\Build\timestamps.csv"
          echo "Build_End,$endTime,$w3cTraceparent" >> "$env:DATA_DIR\Build\timestamps.csv"

          $actualSec = ((Get-Date $endTime) - (Get-Date $startTime)).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$env:DATA_DIR\Build\duration_check.json" @{ task_seconds = [math]::Round($actualSec,2); profiler_cap_seconds = $profilerCap; usable_cap_seconds = $usableCap; truncated = $truncated }
          if ($truncated) {
            Write-Error "TRUNCATED DATA: Build ran ${actualSec}s but profiler usable window was ${usableCap}s"
            exit 1
          }
        shell: powershell

      # --- SCENARIO 4: TEST SUITE (vitest) ---
      - name: Profile Test Suite
        run: |
          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"
          $profilerCap = 600
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$env:DATA_DIR\Test\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10

          $startTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/amd64 $env:NODE_IMAGE yarn test:vitest ; $global:LASTEXITCODE = 0
          $endTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss.fff"

          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue

          echo "Test_Start,$startTime,$w3cTraceparent" > "$env:DATA_DIR\Test\timestamps.csv"
          echo "Test_End,$endTime,$w3cTraceparent" >> "$env:DATA_DIR\Test\timestamps.csv"

          $actualSec = ((Get-Date $endTime) - (Get-Date $startTime)).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$env:DATA_DIR\Test\duration_check.json" @{ task_seconds = [math]::Round($actualSec,2); profiler_cap_seconds = $profilerCap; usable_cap_seconds = $usableCap; truncated = $truncated }
          if ($truncated) {
            Write-Error "TRUNCATED DATA: Test ran ${actualSec}s but profiler usable window was ${usableCap}s"
            exit 1
          }
        shell: powershell

      # --- SCENARIO 5: VITEST DIRECTORY SPANS ---
      # All spans run inside ONE persistent container via docker exec so Docker
      # startup overhead is paid once instead of once per span.
      - name: Profile Vitest Directory Spans
        run: |
          $scenario = "Vitest_Directory_Spans"
          $scenarioDir = Join-Path $env:DATA_DIR $scenario
          $rawSpans = Join-Path $scenarioDir "pipeline_spans.ndjson"
          $spansJson = Join-Path $scenarioDir "spans.json"
          Remove-Item -LiteralPath $rawSpans, $spansJson -Force -ErrorAction SilentlyContinue

          $w3cTraceparent = "00-$((New-Guid).Guid.Replace('-',''))-$(((New-Guid).Guid.Replace('-','')).Substring(0,16))-01"

          $profilerCap = 3600
          $uprof = Start-Process -FilePath "$env:UPROF_PATH" -ArgumentList "timechart --event power --interval 100 -d $profilerCap -o `"$scenarioDir\power_data.csv`"" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 10

          $failedSpanCount = 0
          $scenarioStartClock = Get-Date
          $startTime = $scenarioStartClock.ToString("yyyy-MM-dd HH:mm:ss.fff")
          $startEpochMs = [DateTimeOffset]::new($scenarioStartClock, [System.TimeZoneInfo]::Local.GetUtcOffset($scenarioStartClock)).ToUnixTimeMilliseconds()

          Write-Host "Starting persistent Node runner container..."
          $containerId = [string](docker run -d -v "${PWD}:/app" -w /app --platform linux/amd64 $env:NODE_IMAGE sleep infinity | Select-Object -Last 1)
          $containerId = $containerId.Trim()
          if ([string]::IsNullOrWhiteSpace($containerId)) {
            throw "Failed to start persistent Node runner container: container ID is empty"
          }
          Write-Host "Runner container ID: $containerId"

          function Invoke-PipelineSpan {
            param(
              [Parameter(Mandatory=$true)][string]$Name,
              [Parameter(Mandatory=$true)][string[]]$VitestArgs,
              [string]$TestPath = "",
              [bool]$Calibration = $false
            )

            Write-Host "Running external CI/CD span: $Name"
            $startMs = [DateTimeOffset]::Now.ToUnixTimeMilliseconds()
            $execArgs = @("exec", $containerId, "yarn", "vitest", "run") + $VitestArgs
            & docker @execArgs
            $exitCode = $LASTEXITCODE
            $endMs = [DateTimeOffset]::Now.ToUnixTimeMilliseconds()

            if ($exitCode -ne 0 -and -not $Calibration) {
              $script:failedSpanCount += 1
              Write-Warning "Span $Name exited with code $exitCode; recording and continuing."
            } elseif ($exitCode -ne 0) {
              Write-Host "Calibration span $Name exited with code $exitCode; recording as calibration overhead."
            }

            $commandText = "yarn vitest run " + ($VitestArgs -join " ")
            node scripts\make_pipeline_spans.js record `
              --output "$rawSpans" `
              --name "$Name" `
              --start-ms "$startMs" `
              --end-ms "$endMs" `
              --exit-code "$exitCode" `
              --test-path "$TestPath" `
              --command "$commandText" `
              --calibration "$Calibration" `
              --operation "vitest-directory"

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to record pipeline span $Name"
            }
          }

          for ($i = 1; $i -le 3; $i++) {
            Invoke-PipelineSpan -Name "vitest.CalibrationEmpty.$i" -VitestArgs @("test/fixtures") -Calibration $true
          }

          $rootTestFiles = @("test/server.ts", "test/client.ts")
          Invoke-PipelineSpan -Name "vitest.Root" -VitestArgs $rootTestFiles -TestPath "test/root-files"

          $testDirectories = @(
            "client",
            "commands",
            "models",
            "plugins",
            "shared",
            "src",
            "tests"
          )

          foreach ($testDirectory in $testDirectories) {
            Invoke-PipelineSpan -Name "vitest.$testDirectory" -VitestArgs @("test/$testDirectory") -TestPath "test/$testDirectory"
          }

          $scenarioEndClock = Get-Date
          $endTime = $scenarioEndClock.ToString("yyyy-MM-dd HH:mm:ss.fff")

          docker stop $containerId | Out-Null
          docker rm  $containerId | Out-Null

          Start-Sleep -Seconds 10
          Stop-Process -Id $uprof.Id -Force -ErrorAction SilentlyContinue

          echo "${scenario}_Start,$startTime,$w3cTraceparent,$startEpochMs" > "$scenarioDir\timestamps.csv"
          echo "${scenario}_End,$endTime,$w3cTraceparent" >> "$scenarioDir\timestamps.csv"

          node scripts\make_pipeline_spans.js build --input "$rawSpans" --output "$spansJson" --traceparent "$w3cTraceparent" --scenario "$scenario"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build spans.json for $scenario"
          }

          $actualSec = ($scenarioEndClock - $scenarioStartClock).TotalSeconds
          $usableCap = $profilerCap - 20
          $truncated = $actualSec -gt $usableCap
          $spanCount = @(Get-Content -LiteralPath $rawSpans | Where-Object { $_.Trim().Length -gt 0 }).Count
          . "$env:DATA_DIR\write-json.ps1"
          Write-Utf8JsonNoBom "$scenarioDir\duration_check.json" @{
            scenario = $scenario
            profiler_cap_seconds = $profilerCap
            usable_cap_seconds = $usableCap
            actual_duration_seconds = [math]::Round($actualSec, 2)
            task_seconds = [math]::Round($actualSec, 2)
            truncated = $truncated
            overrun = $truncated
            span_count = $spanCount
            failed_span_count = $failedSpanCount
            calibration_repetitions = 3
          }

          if ($spanCount -ne 11) {
            Write-Error "Expected 11 span records but found $spanCount"
            exit 1
          }

          if ($truncated) {
            Write-Error "TRUNCATED DATA: Vitest directory spans ran ${actualSec}s but profiler usable window was ${usableCap}s"
            exit 1
          }
        shell: powershell

      - name: Upload Traces as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-traces-${{ env.RUN_ID }}
          path: ${{ env.DATA_DIR }}
          retention-days: 90

      - name: Offload to MinIO Bucket
        env:
          AWS_ACCESS_KEY_ID: researcher
          AWS_SECRET_ACCESS_KEY: supersecretpassword
          AWS_DEFAULT_REGION: us-east-1
        run: |
          Write-Host "Compressing Raw Telemetry..."
          $scenarios = @("Idle", "Yarn_Install", "Build", "Test", "Vitest_Directory_Spans")
          foreach ($scenario in $scenarios) {
            $scenarioDir = Join-Path $env:DATA_DIR $scenario
            $rootTimechart = Join-Path $scenarioDir "timechart.csv"
            $timestamps = Join-Path $scenarioDir "timestamps.csv"

            if (-not (Test-Path -LiteralPath $rootTimechart)) {
              $nestedTimechart = Get-ChildItem -LiteralPath $scenarioDir -Recurse -Filter "timechart.csv" -File |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 1

              if ($null -eq $nestedTimechart) {
                throw "Missing timechart.csv for $scenario; refusing to upload incomplete telemetry."
              }

              Copy-Item -LiteralPath $nestedTimechart.FullName -Destination $rootTimechart -Force
            }

            foreach ($requiredFile in @($rootTimechart, $timestamps)) {
              if (-not (Test-Path -LiteralPath $requiredFile)) {
                throw "Missing required telemetry file: $requiredFile"
              }
              if ((Get-Item -LiteralPath $requiredFile).Length -eq 0) {
                throw "Required telemetry file is empty: $requiredFile"
              }
            }

            $files = @($rootTimechart, $timestamps)
            $durationCheck = Join-Path $scenarioDir "duration_check.json"
            if (Test-Path -LiteralPath $durationCheck) {
              $files += $durationCheck
            }
            $spansJson = Join-Path $scenarioDir "spans.json"
            if ($scenario -eq "Vitest_Directory_Spans") {
              if (-not (Test-Path -LiteralPath $spansJson)) {
                throw "Missing required spans.json for $scenario"
              }
              if ((Get-Item -LiteralPath $spansJson).Length -eq 0) {
                throw "Required spans.json is empty for $scenario"
              }
              $files += $spansJson
            }

            Compress-Archive -LiteralPath $files -DestinationPath "$env:DATA_DIR\$scenario.zip" -Force
          }

          Write-Host "Uploading to MinIO Cloud (thelounge project)..."
          $awsExe = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"
          & $awsExe s3 cp "$env:DATA_DIR\hardware_metadata.json" "s3://energy-research-data/raw-telemetry/$env:PROJECT_NAME/$env:RUN_ID/hardware_metadata.json" --endpoint-url http://100.67.86.32:9000
          & $awsExe s3 cp "$env:DATA_DIR\Idle.zip"                   "s3://energy-research-data/raw-telemetry/$env:PROJECT_NAME/$env:RUN_ID/Idle.zip"                   --endpoint-url http://100.67.86.32:9000
          & $awsExe s3 cp "$env:DATA_DIR\Yarn_Install.zip"          "s3://energy-research-data/raw-telemetry/$env:PROJECT_NAME/$env:RUN_ID/Yarn_Install.zip"          --endpoint-url http://100.67.86.32:9000
          & $awsExe s3 cp "$env:DATA_DIR\Build.zip"                 "s3://energy-research-data/raw-telemetry/$env:PROJECT_NAME/$env:RUN_ID/Build.zip"                 --endpoint-url http://100.67.86.32:9000
          & $awsExe s3 cp "$env:DATA_DIR\Test.zip"                  "s3://energy-research-data/raw-telemetry/$env:PROJECT_NAME/$env:RUN_ID/Test.zip"                  --endpoint-url http://100.67.86.32:9000
          & $awsExe s3 cp "$env:DATA_DIR\Vitest_Directory_Spans.zip" "s3://energy-research-data/raw-telemetry/$env:PROJECT_NAME/$env:RUN_ID/Vitest_Directory_Spans.zip" --endpoint-url http://100.67.86.32:9000

          Write-Host "Cleaning up local disk..."
          Remove-Item -Path "$env:DATA_DIR" -Recurse -Force
        shell: powershell

  profile-mac:
    name: Profile Apple Mac M2
    runs-on: [self-hosted, macos]
    permissions:
      contents: write

    env:
      PROJECT_NAME: "thelounge"
      RUN_ID: "mac_${{ github.run_id }}"
      DATA_DIR: "${{ github.workspace }}/ResearchData/cpudata/mac_${{ github.run_id }}"
      NODE_IMAGE: "node:22"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Directory Structure
        run: |
          mkdir -p "$DATA_DIR/Idle"
          mkdir -p "$DATA_DIR/Yarn_Install"
          mkdir -p "$DATA_DIR/Build"
          mkdir -p "$DATA_DIR/Test"
          mkdir -p "$DATA_DIR/Vitest_Directory_Spans"
        shell: bash

      - name: Capture Hardware Metadata
        run: |
          META_FILE="$DATA_DIR/hardware_metadata.json"
          CPU_MODEL=$(sysctl -n machdep.cpu.brand_string 2>/dev/null || echo "Apple Silicon")
          TOTAL_CORES=$(sysctl -n hw.physicalcpu)
          CPU_THREADS=$(sysctl -n hw.logicalcpu)
          RAM_GB=$(echo "scale=1; $(sysctl -n hw.memsize) / 1073741824" | bc)
          OS_VER=$(sw_vers -productVersion)
          DOCKER_VER=$(docker --version)
          cat > "$META_FILE" << EOFMETA
          {
            "platform": "mac_m2_macos",
            "captured_at": "$(date '+%Y-%m-%d %H:%M:%S')",
            "cpu_model": "$CPU_MODEL",
            "cpu_cores": $TOTAL_CORES,
            "cpu_threads": $CPU_THREADS,
            "ram_gb": $RAM_GB,
            "os_version": "macOS $OS_VER",
            "docker_ver": "$DOCKER_VER"
          }
          EOFMETA
          echo "Hardware metadata captured:"
          cat "$META_FILE"
        shell: bash

      # --- INFRASTRUCTURE: pre-pull Node image (NOT profiled) ---
      # The image download must NOT happen inside a measured scenario, or its
      # network/disk cost would pollute the Yarn_Install energy reading.
      - name: Pre-pull Node Image
        run: |
          echo "Pre-pulling $NODE_IMAGE (excluded from all measurements)..."
          docker pull --platform linux/arm64 "$NODE_IMAGE"
        shell: bash

      # --- SCENARIO 1: IDLE (BASELINE) ---
      - name: Profile Idle Scenario
        run: |
          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          echo "Generated Trace-ID: $W3C_TRACEPARENT"
          sudo powermetrics --samplers cpu_power -i 100 -n 600 > "$DATA_DIR/Idle/power_data.txt" 2>/dev/null &
          PROF_PID=$!

          echo "Capturing 10-second pre-execution baseline..."
          sleep 10

          echo "Idle baseline measurement..."
          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          sleep 30
          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")

          echo "Capturing 10-second post-execution cooldown..."
          sleep 10

          sudo kill $PROF_PID 2>/dev/null || true
          wait $PROF_PID 2>/dev/null || true

          echo "Idle_Start,$START_TIME,$W3C_TRACEPARENT" > "$DATA_DIR/Idle/timestamps.csv"
          echo "Idle_End,$END_TIME,$W3C_TRACEPARENT" >> "$DATA_DIR/Idle/timestamps.csv"
        shell: bash

      # --- SCENARIO 2: YARN INSTALL ---
      - name: Profile Yarn Install
        run: |
          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          PROFILER_CAP=900
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$DATA_DIR/Yarn_Install/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10

          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/arm64 "$NODE_IMAGE" yarn install --frozen-lockfile || true
          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")

          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true
          wait $PROF_PID 2>/dev/null || true

          echo "Yarn_Install_Start,$START_TIME,$W3C_TRACEPARENT" > "$DATA_DIR/Yarn_Install/timestamps.csv"
          echo "Yarn_Install_End,$END_TIME,$W3C_TRACEPARENT" >> "$DATA_DIR/Yarn_Install/timestamps.csv"

          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          echo "{\"task_seconds\": $ACTUAL_SEC, \"profiler_cap_seconds\": $PROFILER_CAP, \"usable_cap_seconds\": $USABLE_CAP, \"truncated\": $TRUNCATED}" > "$DATA_DIR/Yarn_Install/duration_check.json"
          if [ "$TRUNCATED" = "true" ]; then
            echo "TRUNCATED DATA: Yarn install ran ${ACTUAL_SEC}s but profiler usable window was ${USABLE_CAP}s"
            exit 1
          fi
        shell: bash

      # --- SCENARIO 3: BUILD ---
      - name: Profile Build
        run: |
          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          PROFILER_CAP=600
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$DATA_DIR/Build/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10

          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/arm64 "$NODE_IMAGE" yarn build || true
          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")

          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true
          wait $PROF_PID 2>/dev/null || true

          echo "Build_Start,$START_TIME,$W3C_TRACEPARENT" > "$DATA_DIR/Build/timestamps.csv"
          echo "Build_End,$END_TIME,$W3C_TRACEPARENT" >> "$DATA_DIR/Build/timestamps.csv"

          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          echo "{\"task_seconds\": $ACTUAL_SEC, \"profiler_cap_seconds\": $PROFILER_CAP, \"usable_cap_seconds\": $USABLE_CAP, \"truncated\": $TRUNCATED}" > "$DATA_DIR/Build/duration_check.json"
          if [ "$TRUNCATED" = "true" ]; then
            echo "TRUNCATED DATA: Build ran ${ACTUAL_SEC}s but profiler usable window was ${USABLE_CAP}s"
            exit 1
          fi
        shell: bash

      # --- SCENARIO 4: TEST SUITE (vitest) ---
      - name: Profile Test Suite
        run: |
          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"
          PROFILER_CAP=600
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$DATA_DIR/Test/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10

          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          docker run --rm -v "${PWD}:/app" -w /app --platform linux/arm64 "$NODE_IMAGE" yarn test:vitest || true
          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")

          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true
          wait $PROF_PID 2>/dev/null || true

          echo "Test_Start,$START_TIME,$W3C_TRACEPARENT" > "$DATA_DIR/Test/timestamps.csv"
          echo "Test_End,$END_TIME,$W3C_TRACEPARENT" >> "$DATA_DIR/Test/timestamps.csv"

          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          echo "{\"task_seconds\": $ACTUAL_SEC, \"profiler_cap_seconds\": $PROFILER_CAP, \"usable_cap_seconds\": $USABLE_CAP, \"truncated\": $TRUNCATED}" > "$DATA_DIR/Test/duration_check.json"
          if [ "$TRUNCATED" = "true" ]; then
            echo "TRUNCATED DATA: Test ran ${ACTUAL_SEC}s but profiler usable window was ${USABLE_CAP}s"
            exit 1
          fi
        shell: bash

      # --- SCENARIO 5: VITEST DIRECTORY SPANS ---
      - name: Profile Vitest Directory Spans
        run: |
          set -euo pipefail
          SCENARIO="Vitest_Directory_Spans"
          SCENARIO_DIR="$DATA_DIR/$SCENARIO"
          RAW_SPANS="$SCENARIO_DIR/pipeline_spans.ndjson"
          SPANS_JSON="$SCENARIO_DIR/spans.json"
          rm -f "$RAW_SPANS" "$SPANS_JSON"

          W3C_TRACEPARENT="00-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]')-$(uuidgen | tr -d '-' | tr '[:upper:]' '[:lower:]' | cut -c1-16)-01"

          PROFILER_CAP=3600
          sudo powermetrics --samplers cpu_power -i 100 -n $((PROFILER_CAP * 10)) > "$SCENARIO_DIR/power_data.txt" 2>/dev/null &
          PROF_PID=$!
          sleep 10

          FAILED_SPAN_COUNT=0
          START_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")
          START_EPOCH_MS=$(node -e "console.log(Date.now())")

          CONTAINER_ID=$(docker run -d -v "${PWD}:/app" -w /app --platform linux/arm64 "$NODE_IMAGE" sleep infinity)
          CONTAINER_ID=$(echo "$CONTAINER_ID" | tr -d '[:space:]')
          if [ -z "$CONTAINER_ID" ]; then
            echo "Failed to start persistent Node runner container"
            exit 1
          fi

          run_span() {
            local name="$1"
            local calibration="$2"
            local test_path="$3"
            shift 3

            echo "Running external CI/CD span: $name"
            local start_ms
            start_ms=$(node -e "console.log(Date.now())")
            set +e
            docker exec "$CONTAINER_ID" yarn vitest run "$@"
            local exit_code=$?
            set -e
            local end_ms
            end_ms=$(node -e "console.log(Date.now())")

            if [ "$exit_code" -ne 0 ] && [ "$calibration" != "true" ]; then
              FAILED_SPAN_COUNT=$((FAILED_SPAN_COUNT + 1))
              echo "WARNING: Span $name exited with code $exit_code; recording and continuing."
            elif [ "$exit_code" -ne 0 ]; then
              echo "Calibration span $name exited with code $exit_code; recording as calibration overhead."
            fi

            node scripts/make_pipeline_spans.js record \
              --output "$RAW_SPANS" \
              --name "$name" \
              --start-ms "$start_ms" \
              --end-ms "$end_ms" \
              --exit-code "$exit_code" \
              --test-path "$test_path" \
              --command "yarn vitest run $*" \
              --calibration "$calibration" \
              --operation "vitest-directory"
          }

          for REP in 1 2 3; do
            run_span "vitest.CalibrationEmpty.$REP" "true" "" test/fixtures
          done

          run_span "vitest.Root" "false" "test/root-files" test/server.ts test/client.ts

          for TEST_DIR in client commands models plugins shared src tests; do
            run_span "vitest.$TEST_DIR" "false" "test/$TEST_DIR" "test/$TEST_DIR"
          done

          END_TIME=$(python3 -c "from datetime import datetime; print(datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3])")

          docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true
          docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true

          sleep 10
          sudo kill $PROF_PID 2>/dev/null || true
          wait $PROF_PID 2>/dev/null || true

          echo "${SCENARIO}_Start,$START_TIME,$W3C_TRACEPARENT,$START_EPOCH_MS" > "$SCENARIO_DIR/timestamps.csv"
          echo "${SCENARIO}_End,$END_TIME,$W3C_TRACEPARENT" >> "$SCENARIO_DIR/timestamps.csv"

          node scripts/make_pipeline_spans.js build --input "$RAW_SPANS" --output "$SPANS_JSON" --traceparent "$W3C_TRACEPARENT" --scenario "$SCENARIO"

          ACTUAL_SEC=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_TIME','%Y-%m-%d %H:%M:%S.%f'); e=datetime.strptime('$END_TIME','%Y-%m-%d %H:%M:%S.%f'); print(round((e-s).total_seconds(),2))")
          USABLE_CAP=$((PROFILER_CAP - 20))
          TRUNCATED=$(python3 -c "print('true' if $ACTUAL_SEC > $USABLE_CAP else 'false')")
          SPAN_COUNT=$(grep -cve '^[[:space:]]*$' "$RAW_SPANS")
          cat > "$SCENARIO_DIR/duration_check.json" << EOFJSON
          {
            "scenario": "$SCENARIO",
            "profiler_cap_seconds": $PROFILER_CAP,
            "usable_cap_seconds": $USABLE_CAP,
            "actual_duration_seconds": $ACTUAL_SEC,
            "task_seconds": $ACTUAL_SEC,
            "truncated": $TRUNCATED,
            "overrun": $TRUNCATED,
            "span_count": $SPAN_COUNT,
            "failed_span_count": $FAILED_SPAN_COUNT,
            "calibration_repetitions": 3
          }
          EOFJSON

          if [ "$SPAN_COUNT" -ne 11 ]; then
            echo "Expected 11 span records but found $SPAN_COUNT"
            exit 1
          fi

          if [ "$TRUNCATED" = "true" ]; then
            echo "TRUNCATED DATA: Vitest directory spans ran ${ACTUAL_SEC}s but profiler usable window was ${USABLE_CAP}s"
            exit 1
          fi
        shell: bash

      # --- CONVERT: powermetrics to AMD-compatible timechart.csv ---
      - name: Convert powermetrics to timechart.csv
        if: always()
        run: |
          echo "Converting powermetrics output to AMD-compatible timechart.csv..."
          python3 scripts/parse_powermetrics.py "$RUN_ID"
        shell: bash

      - name: Validate Converted Data
        if: always()
        run: |
          set -euo pipefail
          echo "Validating converted timechart.csv files..."
          FAIL=0
          for SCENARIO in Idle Yarn_Install Build Test Vitest_Directory_Spans; do
            CSV="$DATA_DIR/$SCENARIO/timechart.csv"
            TS="$DATA_DIR/$SCENARIO/timestamps.csv"
            if [ ! -s "$CSV" ]; then
              echo "ERROR: MISSING or EMPTY: $CSV"
              FAIL=1
            else
              ROWS=$(tail -n +3 "$CSV" | wc -l | tr -d ' ')
              if [ "$ROWS" -lt 1 ]; then
                echo "ERROR: $CSV has 0 data rows"
                FAIL=1
              else
                echo "OK: $SCENARIO: $ROWS data rows"
              fi
            fi
            if [ ! -s "$TS" ]; then
              echo "ERROR: MISSING or EMPTY: $TS"
              FAIL=1
            fi
            if [ "$SCENARIO" = "Vitest_Directory_Spans" ]; then
              if [ ! -s "$DATA_DIR/$SCENARIO/spans.json" ]; then
                echo "ERROR: MISSING or EMPTY: spans.json"
                FAIL=1
              fi
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "ERROR: VALIDATION FAILED - corrupt data will NOT be uploaded"
            exit 1
          else
            echo "OK: All telemetry files validated successfully"
          fi
        shell: bash

      - name: Upload Traces as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-traces-${{ env.RUN_ID }}
          path: ${{ env.DATA_DIR }}
          retention-days: 90

      - name: Offload to MinIO Bucket
        env:
          AWS_ACCESS_KEY_ID: researcher
          AWS_SECRET_ACCESS_KEY: supersecretpassword
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          echo "Compressing Raw Telemetry..."
          for SCENARIO in Idle Yarn_Install Build Test Vitest_Directory_Spans; do
            SCENARIO_DIR="$DATA_DIR/$SCENARIO"
            FILES=("$SCENARIO_DIR/timechart.csv" "$SCENARIO_DIR/timestamps.csv")

            for REQUIRED_FILE in "$SCENARIO_DIR/timechart.csv" "$SCENARIO_DIR/timestamps.csv"; do
              if [ ! -s "$REQUIRED_FILE" ]; then
                echo "ERROR: Missing or empty required telemetry file: $REQUIRED_FILE"
                exit 1
              fi
            done

            if [ -f "$SCENARIO_DIR/duration_check.json" ]; then
              FILES+=("$SCENARIO_DIR/duration_check.json")
            fi

            if [ "$SCENARIO" = "Vitest_Directory_Spans" ]; then
              if [ ! -s "$SCENARIO_DIR/spans.json" ]; then
                echo "ERROR: Missing or empty spans.json for $SCENARIO"
                exit 1
              fi
              FILES+=("$SCENARIO_DIR/spans.json")
            fi

            zip -j "$DATA_DIR/${SCENARIO}.zip" "${FILES[@]}"
            zip -T "$DATA_DIR/${SCENARIO}.zip"
          done

          echo "Uploading to MinIO Cloud (thelounge project)..."
          docker run --rm -v "$DATA_DIR:/data" --entrypoint sh minio/mc -c "\
            mc alias set myminio http://100.67.86.32:9000 researcher supersecretpassword && \
            mc cp /data/hardware_metadata.json myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/hardware_metadata.json && \
            mc cp /data/Idle.zip                   myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Idle.zip && \
            mc cp /data/Yarn_Install.zip           myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Yarn_Install.zip && \
            mc cp /data/Build.zip                  myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Build.zip && \
            mc cp /data/Test.zip                   myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Test.zip && \
            mc cp /data/Vitest_Directory_Spans.zip myminio/energy-research-data/raw-telemetry/$PROJECT_NAME/$RUN_ID/Vitest_Directory_Spans.zip"

          echo "Cleaning up local disk..."
          rm -rf "$DATA_DIR"
        shell: bash
